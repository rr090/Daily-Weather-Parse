name: Daily Weather Parse

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run weather script
        run: python weather.py

      - name: Show weather.json (first 500 chars)
        run: head -c 500 weather.json

      - name: Show current CSV (tail)
        run: tail -n 5 weather_current_*.csv || true

      - name: Show daily CSV (tail)
        run: tail -n 5 weather_daily_*.csv || true

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update weather data [skip ci]"
          file_pattern: "weather.json weather_current_*.csv weather_daily_*.csv"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com