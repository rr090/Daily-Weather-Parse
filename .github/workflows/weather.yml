name: Daily Weather Parse

on:
  schedule:
    # Запуск каждый день в 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  fetch-weather:
    runs-on: ubuntu-latest

    # Явно разрешаем запись в репозиторий, чтобы работал git push
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run weather script
        run: python weather.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather.json
          # Проверяем, есть ли изменения, чтобы не делать пустой коммит
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update weather data [skip ci]"
            git push
          fi